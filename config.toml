baseURL = 'https://www.turtlerabbit.org/'
languageCode = 'en-us'
theme= "hugo-cohub"
title = 'RAM'
publishDir = 'public'

[pagination]
  pagerSize = 6

  # Main Menu
  [[menu.Main]]
  name = "Home"
  url= "/"
  weight = 1
  [[menu.Main]]
  name = "About"
  url= "/about/"
  weight = 2
  [[menu.Main]]
  name = "Team"
  url= "/team/"
  weight = 3
  [[menu.Main]]
  name = "Docs"
  url= "/docs/"
  weight = 4
  [[menu.Main]]
  name = "Blog"
  url= "#blog"
  weight = 5
  [[menu.Main]]
  name = "Sponsors"
  url= "/sponsors/"
  weight = 6
  [[menu.Main]]
  name = "FAQ"
  url= "#faq"
  weight = 7
  [[menu.Main]]
  name = "Contact"
  url= "/contact/"
