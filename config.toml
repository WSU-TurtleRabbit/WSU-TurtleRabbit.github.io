  # Sitemap Menu
  [[menu.sitemap]]
  name = "Privacy Policy"
  url = "https://www.westernsydney.edu.au/about_uws/leadership/governance/privacy_at_western_sydney_university"
  weight = 1

[params]
  tagline = "Robotics, Automation & Manufacturing at Western Sydney University"
  description = "RAM is the Robotics, Automation and Manufacturing club at Western Sydney University. Our flagship team, TurtleRabbit, competes in the RoboCup Small Size League with open-source robots built from scratch."
  theme_overrides = "css/overrides.css"
  aboutPageURL = "blog"
  contactLink = "contact"
  copyright = "© {year} <a href=\"https://www.westernsydney.edu.au/\" target=\"_blank\">Western Sydney University </a>"
  # Destination for sponsorship expressions of interest. The form on /sponsors/
  # composes a mailto: from this address — there is no server-side handler, so
  # changing this address is all that is needed to redirect enquiries.
  sponsorshipEmail = "ram_exec@student.westernsydney.edu.au"
  # Unused. Left in place only because the theme's own contact/sponsors
  # templates still reference it; the project templates no longer do.
  fabFormURL =  "https://fabform.io/f/cCNKH7r"
  googleAnalytics = ""
  # Black artwork on transparency is deliberate: overrides.css applies
  # `filter: brightness(0) invert(1)` over the dark hero and in the footer,
  # and `filter: none` on the light scrolled nav. Black+alpha works in both.
  logo = "images/ram-logo.png"
  footerlogo = "images/ram-logo.png"
  footerDescription = "Work described on this page has been produced by Western Sydney University students and academics."
  [params.f360]
  url = "https://westernsydney15.autodesk360.com/shares/public/SH512d4QTec90decfa6e3d2e30041a89ddec?mode=embed"
  width = "800"
  height = "400"
  allowfullscreen = "true"
  frameborder = "0"

  [params.bookmarks]
  description = " "
  image = "images/render.png"

  # Each group renders as its own <h3> + <ul>. Add a group to add a list.
    [[params.bookmarks.groups]]
    name = "TurtleRabbit SSL Team"
      [[params.bookmarks.groups.links]]
      title = "Our GitHub"
      url = "https://github.com/WSU-TurtleRabbit"
      label = "https://github.com/WSU-TurtleRabbit"
      [[params.bookmarks.groups.links]]
      title = "2025 Team Description Paper"
      url = "https://tdpsearch.com/paper/soccer_smallsize__2025__TurtleRabbit"
      label = "https://tdpsearch.com/paper/soccer_smallsize__2025__TurtleRabbit"
      [[params.bookmarks.groups.links]]
      title = "RAM Club YouTube"
      url = "https://www.youtube.com/@RAMClub_WS"
      label = "https://www.youtube.com/@RAMClub_WS"
      [[params.bookmarks.groups.links]]
      title = "Find all our links"
      url = "https://linktr.ee/ramclub"
      label = "https://linktr.ee/ramclub"

  # Social icons
  [[params.social]]
  icon = "ti-github"
  url = "https://github.com/WSU-TurtleRabbit"
  weight = 1
  [[params.social]]
  icon = "ti-facebook"
