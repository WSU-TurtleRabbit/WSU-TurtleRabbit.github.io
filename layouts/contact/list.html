{{define "main"}}
<section class="contact-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 mx-auto col-md-12">
        <div class="page-header">
          <h2> {{ .Title }}</h2>
          <p>{{.Params.subTitle}}</p>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="contact-form">
          <h2>Contact Form</h2>
          {{ $inbox := .Site.Params.sponsorshipEmail }}
          <!--
            This overrides the theme's contact/list.html, which posted straight to a
            hardcoded Discord webhook. That never worked (Discord expects a `content`
            field, not `Name`/`email`/`message`) and it published a webhook secret in
            the built HTML. Now handled by partials/emailFormScript.html.

            NOTE: the form deliberately has no `id="contact-form"`. The theme's
            assets/js/formhandler.js binds to that id and AJAX-posts to form.action;
            keeping the id would have that script fight this one.
          -->
          <form id="contact-enquiry-form" class="row"
                data-inbox="{{ $inbox }}"
                data-subject="Website enquiry"
                data-subject-from="contact-name"
                data-status="contact-enquiry-status">
            <div class="col-md-6">
              <input type="text" class="form-control" id="contact-name" data-label="Name" placeholder="Your Name" required>
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control" id="contact-email" data-label="Email" required placeholder="Your Email">
            </div>
            <div class="col-md-12">
              <textarea class="form-control" id="contact-message" data-label="Message" rows="8"
                placeholder="Message here…" required></textarea>
            </div>
            <div class="col-lg-12">
              <button type="submit" class="btn btn-primary">Send Message</button>
            </div>
          </form>

          <p class="email-form-note">
            This opens your email app with the message ready to send. If nothing
            happens, email us directly at
            <a href="mailto:{{ $inbox }}">{{ $inbox }}</a>
            — or <button type="button" data-copy-for="contact-enquiry-form" class="email-form-copy">copy your message to the clipboard</button>.
          </p>
          <p id="contact-enquiry-status" class="email-form-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </div>
</section>

{{ partial "emailFormScript.html" . }}
{{end}}
