{{ with .Site.Data.video }}
{{ if .enable }}
<section class="video-section" id="video">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="section-title">
          <h2>{{ .title | safeHTML }}</h2>
          <p>
            {{ .subtitle }}
          </p>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-12">
        <div class="video-embed">
          {{/* autoplay only works when muted — browsers block sound-on autoplay */}}
          <iframe
            src="https://www.youtube-nocookie.com/embed/{{ .videoId }}?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1"
            title="{{ .title }}"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
{{ end }}
